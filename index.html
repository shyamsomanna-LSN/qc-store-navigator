/* ── App styles ───────────────────────────────────────────────── */
:root{
  --navy:#0D1E35;--navy2:#1a2f4a;--accent:#F97316;
  --bg:#f5f7fa;--surface:#fff;--border:#e2e6ed;
  --fg:#111827;--fg2:#4b5563;--fg3:#9ca3af;
  --green:#16A34A;--blue:#2563EB;--amber:#D97706;--purple:#9333EA;
  --radius-green:#22c55e44;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Arial,sans-serif;font-size:14px;background:var(--navy)}
#app{display:flex;flex-direction:column;height:100%}

/* HEADER */
#hdr{background:var(--navy);color:#fff;padding:8px max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap}
#hdr-title{font-size:14px;font-weight:700;flex:1;white-space:nowrap}
#loc-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;background:var(--accent);border:none;border-radius:20px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity .15s}
#loc-btn:disabled{opacity:.5;cursor:not-allowed}
#loc-status{font-size:11px;color:rgba(255,255,255,.65);white-space:nowrap}

/* CITY TABS */
#city-bar{background:var(--navy2);padding:6px max(12px,env(safe-area-inset-left,0px));display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.1)}
.ctab{padding:5px 12px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.75);font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.ctab:hover{background:rgba(255,255,255,.18)}
.ctab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}

/* RADIUS BAR */
#radius-bar{background:#132030;padding:6px max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.08)}
#radius-bar span{font-size:11px;color:rgba(255,255,255,.55);white-space:nowrap}
.rbtn{padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.65);font-size:11px;cursor:pointer;transition:all .15s}
.rbtn:hover{background:rgba(255,255,255,.15)}
.rbtn.on{background:#22c55e;border-color:#22c55e;color:#fff;font-weight:700}
#radius-count{font-size:11px;color:#22c55e;margin-left:auto;white-space:nowrap;font-weight:700}

/* MAIN */
#main{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
#sb{width:260px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.sb-sec{padding:10px 12px;border-bottom:1px solid var(--border)}
.sb-sec h3{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--fg3);margin-bottom:7px}
#search{width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:var(--bg);color:var(--fg);outline:none}
#search:focus{border-color:var(--accent)}

/* LEGEND */
.leg{display:flex;align-items:center;gap:7px;padding:4px 0;cursor:pointer;font-size:13px;color:var(--fg);user-select:none}
.leg:hover{color:var(--accent)}
.ldot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.lcnt{margin-left:auto;background:var(--bg);color:var(--fg3);font-size:11px;padding:2px 7px;border-radius:10px}
.leg.dim{opacity:.28}

/* STORE LIST */
#store-list-wrap{flex:1;overflow-y:auto;padding:8px 10px}
.sitem{padding:8px 10px;margin-bottom:5px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer}
.sitem:hover{border-color:var(--accent);background:#FFF7ED}
.sitem-top{display:flex;align-items:flex-start;gap:6px}
.sitem-name{font-weight:600;color:var(--navy);font-size:12px;flex:1;line-height:1.3}
.sitem-dist{font-size:11px;font-weight:700;color:#16A34A;white-space:nowrap;padding-top:1px}
.sitem-brand{font-size:10px;color:var(--fg3);margin-top:3px}
.sitem-actions{display:flex;gap:5px;margin-top:6px}
.btn-nav{display:flex;align-items:center;gap:4px;padding:4px 9px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;text-decoration:none}
.btn-nav svg{width:12px;height:12px}
.btn-share{display:flex;align-items:center;gap:4px;padding:4px 9px;background:var(--bg);color:var(--fg2);border:1px solid var(--border);border-radius:6px;font-size:11px;cursor:pointer}
.btn-share svg{width:12px;height:12px}
.sitem-vis-count{padding:8px 10px;font-size:11px;color:var(--fg3);text-align:center}

/* MAP */
#map{flex:1}

/* POPUP */
.pu{font-family:Arial,sans-serif}
.pu-title{font-size:13px;font-weight:700;color:var(--navy,#0D1E35);margin-bottom:4px}
.pu-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;margin-bottom:5px}
.pu-fkm{background:#DCFCE7;color:#166534}
.pu-bbn{background:#DBEAFE;color:#1D4ED8}
.pu-blinkit{background:#FEF9C3;color:#854D0E}
.pu-instamart{background:#F3E8FF;color:#6B21A8}
.pu-dist{font-size:11px;color:#4b5563;margin-bottom:7px}
.pu-actions{display:flex;gap:6px}
.pu-nav{padding:5px 12px;background:#F97316;color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.pu-shr{padding:5px 10px;background:#f5f7fa;color:#374151;border:1px solid #e2e6ed;border-radius:6px;font-size:12px;cursor:pointer}

/* TOAST */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}

/* NEAR-ME marker */
.me-icon{width:18px;height:18px;background:#2563EB;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 3px rgba(37,99,235,.4)}

/* scrollbar */
#sb::-webkit-scrollbar,#store-list-wrap::-webkit-scrollbar{width:4px}
#sb::-webkit-scrollbar-thumb,#store-list-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* MOBILE: collapse sidebar to bottom sheet on narrow screens */
@media(max-width:600px){
  #main{flex-direction:column}
  #sb{width:100%;height:38vh;border-right:none;border-top:1px solid var(--border)}
  #map{flex:1;min-height:200px}
}
</style>

<div id="app">
  <div id="hdr">
    <div id="hdr-title">📍 QC Store Navigator</div>
    <div id="loc-status">No location</div>

    <button class="rbtn on" data-r="0" onclick="setRadius(0)">All</button>
    <span id="radius-count"></span>
  </div>
  <div id="main">
    <div id="sb">
      <div class="sb-sec">
        <h3>Search store</h3>

      <div class="sb-sec">

        <div id="legend"></div>
      </div>
      <div id="store-list-wrap">
        <div id="store-list"></div>
      </div>
    </div>
    <div id="map"></div>
  </div>
</div>
<div id="toast"></div>

function haversine(lat1,lng1,lat2,lng2){
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function fmtDist(d){ return d<1?Math.round(d*1000)+'m':d.toFixed(1)+'km'; }
function navUrl(slat,slng){
  const origin = userLat!=null?`${userLat},${userLng}`:'';
  return `https://www.google.com/maps/dir/?api=1${origin?'&origin='+origin:''}&destination=${slat},${slng}&travelmode=driving`;
}
function shareStore(s){
  const txt=`${s.name} (${BRAND_CFG[s.brand]?.label||s.brand})\nhttps://www.google.com/maps?q=${s.lat},${s.lng}`;
  if(navigator.share){navigator.share({title:s.name,text:txt}).catch(()=>{});}
  else{try{navigator.clipboard.writeText(txt);showToast('Link copied!');}catch(e){showToast('Copy: '+txt);}}
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function getLocation(){
  const btn=document.getElementById('loc-btn');
  btn.disabled=true; btn.textContent='📡 Locating…';
  if(!navigator.geolocation){showToast('Geolocation not supported');btn.disabled=false;btn.textContent='📡 Find Near Me';return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    userLat=pos.coords.latitude; userLng=pos.coords.longitude;
    document.getElementById('loc-status').textContent=`${userLat.toFixed(4)}, ${userLng.toFixed(4)}`;
    btn.disabled=false; btn.textContent='📡 Refresh Location';
    // Place "you are here" marker
    if(meMarker) meMarker.remove();
    const meIcon=L.divIcon({className:'',html:'<div class="me-icon"></div>',iconSize:[18,18],iconAnchor:[9,9]});
    meMarker=L.marker([userLat,userLng],{icon:meIcon,zIndexOffset:1000})
      .bindPopup('<b>📍 You are here</b>').addTo(map);
    map.setView([userLat,userLng],14);
    if(activeRadius>0) drawRadiusCircle();
    renderAll();
  },err=>{
    btn.disabled=false; btn.textContent='📡 Find Near Me';
    showToast('Could not get location: '+err.message);
  },{enableHighAccuracy:true,timeout:15000});
}

function drawRadiusCircle(){
  if(radiusCircle) radiusCircle.remove();
  if(userLat==null||activeRadius===0){radiusCircle=null;return;}
  radiusCircle=L.circle([userLat,userLng],{radius:activeRadius*1000,color:'#22c55e',fillColor:'#22c55e',fillOpacity:.08,weight:2,dashArray:'6 4'}).addTo(map);
}

function setRadius(r){
  activeRadius=r;
  document.querySelectorAll('.rbtn').forEach(b=>b.classList.toggle('on',+b.dataset.r===r));
  drawRadiusCircle();
  renderAll();
}

// ── RENDER ────────────────────────────────────────────────────────
function getFiltered(){
  let stores = activeCity==='All'?STORES:STORES.filter(s=>s.city===activeCity);
  if(searchQ) stores=stores.filter(s=>s.name.toLowerCase().includes(searchQ)||s.city.toLowerCase().includes(searchQ));
  if(!brandOn.FKM) stores=stores.filter(s=>s.brand!=='FKM');
  if(!brandOn.BBNow) stores=stores.filter(s=>s.brand!=='BBNow');
  if(!brandOn.Blinkit) stores=stores.filter(s=>s.brand!=='Blinkit');
  if(!brandOn.InstaMart) stores=stores.filter(s=>s.brand!=='InstaMart');
  if(activeRadius>0 && userLat!=null){
    stores=stores.filter(s=>haversine(userLat,userLng,s.lat,s.lng)<=activeRadius);
  }
  if(userLat!=null) stores=stores.map(s=>({...s,dist:haversine(userLat,userLng,s.lat,s.lng)})).sort((a,b)=>a.dist-b.dist);
  return stores;
}

function renderAll(){
  Object.values(brandLayers).forEach(l=>l.clearLayers());
  const stores=getFiltered();
  stores.forEach(s=>{
    const cfg=BRAND_CFG[s.brand]||{color:'#888',border:'#555',cls:'',label:s.brand};
    const distHtml=s.dist!=null?`<div class="pu-dist">📍 ${fmtDist(s.dist)} away</div>`:'';
    const m=L.circleMarker([s.lat,s.lng],{radius:7,fillColor:cfg.color,color:cfg.border,weight:1.5,fillOpacity:.88})
      .bindPopup(`<div class="pu"><div class="pu-title">${s.name}</div><span class="pu-badge ${cfg.cls}">${cfg.label}</span> <span style="font-size:10px;color:#6b7280">${s.city}</span>${distHtml}<div class="pu-actions"><a class="pu-nav" href="${navUrl(s.lat,s.lng)}" target="_blank">🗺 Navigate</a><button class="pu-shr" onclick="shareStore(${JSON.stringify(s).replace(/</g,'\\u003c')})">📤 Share</button></div></div>`,{maxWidth:280});
    if(brandLayers[s.brand]) m.addTo(brandLayers[s.brand]);
    else m.addTo(map);
  });
  renderList(stores);
  document.getElementById('radius-count').textContent = activeRadius>0&&userLat!=null?`${stores.length} stores within ${activeRadius}km`:'';
}

function renderList(stores){
  const el=document.getElementById('store-list');
  el.innerHTML='';
  const show=stores.slice(0,150);
  show.forEach(s=>{
    const cfg=BRAND_CFG[s.brand]||{color:'#888',label:s.brand};
    const d=document.createElement('div'); d.className='sitem';
    d.innerHTML=`
      <div class="sitem-top">
        <div class="sitem-name" style="border-left:3px solid ${cfg.color};padding-left:6px">${s.name}</div>
        ${s.dist!=null?`<div class="sitem-dist">${fmtDist(s.dist)}</div>`:''}
      </div>
      <div class="sitem-brand">${cfg.label} · ${s.city}</div>
      <div class="sitem-actions">
        <a class="btn-nav" href="${navUrl(s.lat,s.lng)}" target="_blank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>Navigate</a>
        <button class="btn-share" onclick="event.stopPropagation();shareStore(${JSON.stringify(s).replace(/</g,'\\u003c')})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>Share</button>
      </div>`;
    d.onclick=()=>{ map.setView([s.lat,s.lng],16); };
    el.appendChild(d);
  });
  if(stores.length>150){
    const more=document.createElement('div');
    more.className='sitem-vis-count';
    more.textContent=`+${stores.length-150} more — use search or radius to narrow`;
    el.appendChild(more);
  }
  if(stores.length===0){
    const empty=document.createElement('div');
    empty.className='sitem-vis-count';
    empty.textContent='No stores match. Try a wider radius or different city.';
    el.appendChild(empty);
  }
}

// ── CITY TABS ─────────────────────────────────────────────────────
const cityBar=document.getElementById('city-bar');
['All',...CITIES].forEach(c=>{
  const btn=document.createElement('span');
  btn.className='ctab'+(c==='All'?' on':'');
  btn.textContent=c==='All'?'🌍 All':c;
  btn.onclick=()=>{
    activeCity=c;
    document.querySelectorAll('.ctab').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    if(c!=='All'&&CITY_BOUNDS[c]) map.fitBounds(CITY_BOUNDS[c]);
    else map.setView([20.5,78],5);
    renderAll();
  };
  cityBar.appendChild(btn);
});

// ── LEGEND ───────────────────────────────────────────────────────
const legEl=document.getElementById('legend');
Object.entries(BRAND_CFG).forEach(([b,cfg])=>{
  const cnt=STORES.filter(s=>s.brand===b).length;
  const row=document.createElement('div'); row.className='leg'; row.id='leg-'+b;
  row.innerHTML=`<div class="ldot" style="background:${cfg.color}"></div>${cfg.label}<span class="lcnt">${cnt}</span>`;
  row.onclick=()=>{
    brandOn[b]=!brandOn[b];
    if(brandOn[b]) brandLayers[b].addTo(map); else map.removeLayer(brandLayers[b]);
    row.classList.toggle('dim',!brandOn[b]);
    renderAll();
  };
  legEl.appendChild(row);
});

// ── SEARCH ───────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input',function(){
  searchQ=this.value.trim().toLowerCase();
  renderAll();
  if(searchQ){const s=getFiltered()[0];if(s) map.setView([s.lat,s.lng],15);}
});

// ── INIT ─────────────────────────────────────────────────────────
renderAll();
</script>
